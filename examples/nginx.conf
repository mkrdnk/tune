# Install in nginx's http {} configuration. Provision the two SANs
# tune.example.com and *.tune.example.com with your existing ACME tooling.
map $http_upgrade $tune_connection {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name tune.example.com *.tune.example.com;
    ssl_certificate /etc/letsencrypt/live/tune.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tune.example.com/privkey.pem;

    client_max_body_size 100m;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tune_connection;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
